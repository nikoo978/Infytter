name: CI

on:
  push:
    branches:
      - main
      - coolify-migration-v1069
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Portability audit
        run: npm run audit:portability

      - name: Vite build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Docker build
        run: docker build -t gymflow-ci .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gymflow-ci -p 3000:3000 gymflow-ci
          trap 'docker logs gymflow-ci || true; docker rm -f gymflow-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "GymFlow container did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q "Infytter Fitness"
          curl --fail --silent --show-error http://127.0.0.1:3000/pantalla-acceso | grep -q "Infytter Fitness"
          curl --fail --silent --show-error 'http://127.0.0.1:3000/api/push?action=diagnostics' | grep -q '"runtime":"node"'
          # Imports the production image decoder; uploads stay disabled without storage setup.
          test "$(curl --silent --show-error -o /tmp/avatar-ready.json -w '%{http_code}' http://127.0.0.1:3000/api/avatar)" = "503"
