name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  browser-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --prefix /tmp/infytter-browser --no-audit --no-fund playwright@1.62.1
      - run: node /tmp/infytter-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/qa-role-flows.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/infytter-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-qa-screenshots
          path: /tmp/infytter-role-qa
